<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#FF6B35">
    <title>ArtisanHub Pro - Hors connexion</title>
    <style>
        :root { color-scheme: light; font-family: system-ui, sans-serif; }
        body { display: grid; min-height: 100vh; place-items: center; margin: 0; background: #FFFFFF; color: #0B2545; }
        main { max-width: 420px; padding: 2rem; text-align: center; }
        .logo { display: block; width: 112px; height: 112px; object-fit: cover; margin: 0 auto 1rem; border-radius: 12px; }
        h1 { margin: 0 0 .75rem; }
        p { line-height: 1.6; color: #294361; }
        button { border: 0; border-radius: 10px; padding: .75rem 1rem; background: #FF6B35; color: #0B2545; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <img class="logo" src="/images/artisanhub-pro-logo.jpg" alt="ArtisanHub Pro">
        <h1>Vous êtes hors connexion</h1>
        <p>ArtisanHub Pro n'arrive pas à joindre le serveur. Vérifiez votre connexion puis réessayez.</p>
        <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
</body>
</html>
